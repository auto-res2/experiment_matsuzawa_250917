[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eager_tta_experiments"
version = "0.1.0"
description = "Experiments for EAGER-TTA research paper."
readme = "README.md"
requires-python = ">=3.9"
license = { file="LICENSE" }
authors = [
  { name="AI Researcher", email="researcher@example.com" },
]
dependencies = [
    "torch>=2.0.1",
    "torchvision",
    "torchaudio",
    "timm>=0.9.12",
    "pynvml>=11.5.0",
    "transformers>=4.35.2",
    "datasets>=2.15.0",
    "pandas>=2.0.3",
    "seaborn>=0.13.0",
    "matplotlib>=3.7.3",
    "scikit-learn>=1.3.2",
    "scipy>=1.11.3",
    "pyyaml>=6.0.1",
    "fvcore>=0.1.5.post20221221",
    "ptflops>=0.6.9",
    "numpy>=1.24.3",
    "statsmodels>=0.14.0"
]

[project.scripts]
run-experiments = "src.main:main"
